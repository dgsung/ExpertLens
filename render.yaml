# Render Blueprint for ExpertLens
# https://render.com/docs/blueprint-spec

services:
  # FastAPI Backend
  - type: web
    name: expertlens-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn expertlens.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: src
      - key: HF_TOKEN
        sync: false  # Set manually in Render dashboard
    healthCheckPath: /healthz

  # Static Frontend
  - type: web
    name: expertlens
    runtime: static
    buildCommand: echo "No build needed"
    staticPublishPath: ./frontend
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
