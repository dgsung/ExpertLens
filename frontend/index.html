<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExpertLens Viewer</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/cytoscape@latest/dist/cytoscape.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="session-selector">
            <h1>ExpertLens</h1>
            <div class="session-controls">
                <!-- Search Input -->
                <form id="search-form" class="search-form">
                    <input type="text" id="search-input" placeholder="전문가 검색 (예: 배터리 전문가)" />
                    <button type="submit" id="search-button">검색</button>
                </form>
                <!-- File Upload Fallback -->
                <input type="file" id="session-file" accept=".json" />
                <label for="session-file" class="file-label">파일 로드</label>
                <span id="session-info"></span>
            </div>
        </header>

        <!-- Loading Overlay -->
        <div id="loading-overlay" class="loading-overlay hidden">
            <div class="loading-spinner"></div>
            <p id="loading-message">검색 중...</p>
        </div>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Graph Panel -->
            <section class="graph-panel">
                <div id="cy"></div>
                <div class="graph-legend">
                    <span class="legend-item"><span class="node-expert"></span> Expert</span>
                    <span class="legend-item"><span class="node-company"></span> Company</span>
                </div>
            </section>

            <!-- Detail Panel -->
            <aside class="detail-panel">
                <div id="detail-content">
                    <div class="placeholder">
                        <p>검색어를 입력하거나 세션 파일을 로드하세요.</p>
                        <p>노드를 클릭하면 상세 정보가 표시됩니다.</p>
                    </div>
                </div>
            </aside>
        </main>
    </div>

    <script src="graph.js"></script>
    <script src="api.js"></script>
    <script src="app.js"></script>
</body>
</html>
