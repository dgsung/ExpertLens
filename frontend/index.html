<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExpertLens</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/cytoscape@latest/dist/cytoscape.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>ExpertLens</h1>
            <div class="header-controls">
                <input type="file" id="session-file" accept=".json" />
                <label for="session-file" class="file-label">파일 로드</label>
                <span id="session-info"></span>
            </div>
        </header>

        <!-- Main 3-Column Layout -->
        <main class="main-content">
            <!-- Chat Panel -->
            <section class="chat-panel">
                <div class="chat-messages" id="chat-messages">
                    <div class="message system">
                        <div class="message-content">
                            안녕하세요! 전문가를 검색해보세요.<br>
                            예: "배터리 전문가", "AI 연구원"
                        </div>
                    </div>
                </div>
                <form id="chat-form" class="chat-input-form">
                    <input type="text" id="chat-input" placeholder="전문가 검색..." autocomplete="off" />
                    <button type="submit" id="chat-submit">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 2L11 13M22 2L15 22L11 13L2 9L22 2Z"/>
                        </svg>
                    </button>
                </form>
            </section>

            <!-- Graph Panel -->
            <section class="graph-panel">
                <div id="cy"></div>
                <div class="graph-legend">
                    <span class="legend-item"><span class="node-expert"></span> Expert</span>
                    <span class="legend-item"><span class="node-company"></span> Company</span>
                </div>
            </section>

            <!-- Detail Panel -->
            <aside class="detail-panel">
                <div id="detail-content">
                    <div class="placeholder">
                        <p>노드를 클릭하면 상세 정보가 표시됩니다.</p>
                    </div>
                </div>
            </aside>
        </main>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay hidden">
        <div class="loading-spinner"></div>
        <p id="loading-message">검색 중...</p>
    </div>

    <script src="graph.js"></script>
    <script src="api.js"></script>
    <script src="app.js"></script>
</body>
</html>
